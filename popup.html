<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rashmi AI — Settings</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple: #7C3AED;
      --purple-dark: #6D28D9;
      --purple-light: #EDE9FE;
      --pink: #F472B6;
      --green: #16A34A;
      --red: #DC2626;
      --gray-50: #F9FAFB;
      --gray-100: #F3F4F6;
      --gray-200: #E5E7EB;
      --gray-400: #9CA3AF;
      --gray-600: #4B5563;
      --gray-800: #1F2937;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 360px;
      background: #fff;
      color: var(--gray-800);
      color-scheme: light;
      font-size: 13px;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, var(--purple) 0%, #9333EA 100%);
      padding: 18px 20px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-icon {
      width: 40px; height: 40px;
      background: rgba(255,255,255,0.15);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .header-text h1 { font-size: 16px; font-weight: 700; color: #fff; }
    .header-text p  { font-size: 12px; color: rgba(255,255,255,0.75); margin-top: 2px; }

    /* ── Body ── */
    .body { padding: 20px; display: flex; flex-direction: column; gap: 18px; }

    /* ── Status banner ── */
    .status-banner {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1.5px solid var(--gray-200);
      background: var(--gray-50);
      font-size: 12px;
      min-height: 46px;
    }
    .status-banner.ready  { background: #F0FDF4; border-color: #86EFAC; color: #166534; }
    .status-banner.error  { background: #FEF2F2; border-color: #FCA5A5; color: #991B1B; }
    .status-banner.saving { background: #EFF6FF; border-color: #93C5FD; color: #1D4ED8; }
    .status-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
    .status-body strong { display: block; font-weight: 600; font-size: 13px; margin-bottom: 2px; }
    .status-body span   { color: inherit; opacity: 0.8; }

    /* ── Field group ── */
    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-label {
      font-size: 12px; font-weight: 600;
      color: var(--gray-600); letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .field-hint { font-size: 11px; color: var(--gray-400); }

    /* ── Key input row ── */
    .key-row {
      display: flex; align-items: center; gap: 8px;
    }
    .key-input-wrap {
      position: relative; flex: 1;
    }
    .key-input-wrap input {
      width: 100%;
      padding: 10px 40px 10px 12px;
      border: 1.5px solid var(--gray-200);
      border-radius: 10px;
      font-size: 13px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      letter-spacing: 0.03em;
      outline: none;
      transition: border-color 0.15s;
      background: #fff;
    }
    .key-input-wrap input:focus  { border-color: var(--purple); }
    .key-input-wrap input.valid  { border-color: #86EFAC; }
    .key-input-wrap input.invalid{ border-color: #FCA5A5; }
    .eye-btn {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--gray-400); font-size: 15px; padding: 2px;
      line-height: 1;
    }
    .eye-btn:hover { color: var(--gray-600); }

    .test-btn {
      padding: 9px 14px;
      background: var(--gray-100);
      border: 1.5px solid var(--gray-200);
      border-radius: 10px;
      font-size: 12px; font-weight: 600;
      color: var(--gray-600);
      cursor: pointer; white-space: nowrap;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .test-btn:hover { background: var(--gray-200); }
    .test-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Model selector ── */
    select {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--gray-200);
      border-radius: 10px;
      font-size: 13px;
      outline: none;
      background: #fff;
      cursor: pointer;
      transition: border-color 0.15s;
      color: var(--gray-800);
    }
    select:focus { border-color: var(--purple); }

    /* ── Advanced toggle ── */
    .advanced-toggle {
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; padding: 4px 0;
      color: var(--gray-400); font-size: 12px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.04em;
      user-select: none;
    }
    .advanced-toggle:hover { color: var(--gray-600); }
    .chevron { transition: transform 0.2s; font-style: normal; font-size: 10px; }
    .chevron.open { transform: rotate(180deg); }
    .advanced-body {
      display: none;
      flex-direction: column; gap: 10px;
      padding-top: 10px;
    }
    .advanced-body.open { display: flex; }
    .advanced-body input {
      width: 100%; padding: 9px 12px;
      border: 1.5px solid var(--gray-200); border-radius: 10px;
      font-size: 12px; font-family: monospace; outline: none;
      transition: border-color 0.15s;
    }
    .advanced-body input:focus { border-color: var(--purple); }

    /* ── Save button ── */
    .save-btn {
      width: 100%; padding: 11px;
      background: var(--purple);
      color: #fff; border: none; border-radius: 10px;
      font-size: 14px; font-weight: 700;
      cursor: pointer; transition: background 0.15s;
      letter-spacing: 0.01em;
    }
    .save-btn:hover    { background: var(--purple-dark); }
    .save-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* ── Footer ── */
    .footer {
      border-top: 1px solid var(--gray-100);
      padding: 12px 20px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .footer-version { font-size: 11px; color: var(--gray-400); }
    .footer-link {
      font-size: 11px; color: var(--purple);
      text-decoration: none; font-weight: 500;
    }
    .footer-link:hover { text-decoration: underline; }

    /* ── Divider ── */
    .divider { border: none; border-top: 1px solid var(--gray-100); }
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-icon">🍓</div>
  <div class="header-text">
    <h1>Rashmi AI</h1>
    <p>Your AI browsing companion</p>
  </div>
</div>

<div class="body">

  <!-- Status banner -->
  <div class="status-banner" id="status-banner">
    <span class="status-icon" id="status-icon">⏳</span>
    <div class="status-body">
      <strong id="status-title">Checking…</strong>
      <span id="status-detail">Looking for your API key</span>
    </div>
  </div>

  <!-- API Key -->
  <div class="field-group">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <label class="field-label">Anthropic API Key</label>
      <a class="footer-link" href="https://console.anthropic.com/settings/keys" target="_blank" style="font-size:11px">Get a key →</a>
    </div>
    <div class="key-row">
      <div class="key-input-wrap">
        <input type="password" id="api-key-input" placeholder="sk-ant-api03-…" autocomplete="off" spellcheck="false" />
        <button class="eye-btn" id="eye-btn" title="Show/hide key">👁</button>
      </div>
      <button class="test-btn" id="test-btn">Test</button>
    </div>
    <div class="field-hint" id="key-hint">Enter your Anthropic API key — it's stored locally on your device only.</div>
  </div>

  <!-- Model -->
  <div class="field-group">
    <label class="field-label">Model</label>
    <select id="model-select">
      <option value="claude-haiku-4-5">claude-haiku-4-5 — Fast &amp; efficient</option>
      <option value="claude-sonnet-4-5">claude-sonnet-4-5 — Balanced (recommended)</option>
      <option value="claude-opus-4-5">claude-opus-4-5 — Most capable</option>
      <option value="claude-3-5-haiku-20241022">claude-3-5-haiku — Economy</option>
    </select>
  </div>

  <!-- Save -->
  <button class="save-btn" id="save-btn">Save Settings</button>

  <hr class="divider" />

  <!-- Advanced -->
  <div>
    <div class="advanced-toggle" id="advanced-toggle">
      <span>Advanced (optional proxy)</span>
      <i class="chevron" id="chevron">▼</i>
    </div>
    <div class="advanced-body" id="advanced-body">
      <div class="field-group">
        <label class="field-label" style="text-transform:none;letter-spacing:0">Proxy URL</label>
        <input type="text" id="proxy-url-input" placeholder="http://localhost:3001" />
        <div class="field-hint">Leave blank to call Anthropic directly with your key above.</div>
      </div>
    </div>
  </div>

</div>

<!-- Footer -->
<div class="footer">
  <span class="footer-version">Rashmi AI v1.3.0</span>
  <a class="footer-link" href="https://github.com" target="_blank">View on GitHub</a>
</div>

<script src="popup.js"></script>
</body>
</html>
