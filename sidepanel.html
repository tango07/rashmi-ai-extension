<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rashmi AI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand: #6366f1;
      --brand-dark: #4f46e5;
      --surface: #f8f7ff;
      --border: #e0dff5;
      --text: #1e1b4b;
      --muted: #6b7280;
      --user-bg: #6366f1;
      --think-bg: #fdf4ff;
      --think-border: #e9d5ff;
      --think-text: #6b21a8;
      color-scheme: light;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--surface);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      background: var(--brand);
      color: #fff;
      flex-shrink: 0;
    }
    .header-logo { font-size: 18px; }
    .header-title { font-size: 14px; font-weight: 700; flex: 1; }
    .header-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: #fff;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .header-btn:hover { background: rgba(255,255,255,0.35); }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      border-bottom: 2px solid var(--border);
      background: #fff;
      flex-shrink: 0;
    }
    .tab {
      flex: 1; padding: 9px; font-size: 13px; font-weight: 600;
      color: var(--muted); background: none; border: none; cursor: pointer;
      border-bottom: 2px solid transparent; margin-bottom: -2px;
    }
    .tab.active { color: var(--brand); border-bottom-color: var(--brand); }

    /* ── Context banner ── */
    #context-banner {
      padding: 6px 14px;
      background: #ede9fe;
      border-bottom: 1px solid var(--border);
      font-size: 12px; color: #5b21b6;
      display: flex; align-items: center;
      justify-content: space-between; gap: 8px;
      flex-shrink: 0;
    }
    #context-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    #scan-btn {
      background: #6366f1; color: #fff; border: none;
      border-radius: 6px; padding: 3px 10px;
      font-size: 11px; font-weight: 600; cursor: pointer; flex-shrink: 0;
    }
    #scan-btn:hover { background: #4f46e5; }
    #scan-btn.scanning { opacity: 0.6; cursor: not-allowed; }

    /* ── Chat view ── */
    #chat-view { display: flex; flex-direction: column; flex: 1; overflow: hidden; }

    #messages {
      flex: 1; overflow-y: auto; padding: 12px;
      display: flex; flex-direction: column; gap: 10px;
    }

    /* ── Messages ── */
    .msg {
      max-width: 90%; padding: 10px 13px; border-radius: 12px;
      font-size: 13px; line-height: 1.6; word-break: break-word;
      position: relative;
    }
    .msg.user {
      align-self: flex-end; background: var(--user-bg);
      color: #fff; border-bottom-right-radius: 3px;
      white-space: pre-wrap;
    }
    .msg.assistant {
      align-self: flex-start; background: #fff;
      border: 1px solid var(--border); border-bottom-left-radius: 3px;
      padding-top: 28px; /* room for copy button */
    }
    .msg.error {
      align-self: flex-start; background: #fee2e2;
      border: 1px solid #fca5a5; color: #991b1b;
      white-space: pre-wrap;
    }

    /* ── Copy message button ── */
    .msg-copy-btn {
      position: absolute; top: 7px; right: 8px;
      background: #f3f4f6; border: 1px solid #e5e7eb;
      border-radius: 5px; padding: 2px 8px;
      font-size: 11px; color: var(--muted);
      cursor: pointer; display: flex; align-items: center; gap: 4px;
      transition: background 0.15s;
    }
    .msg-copy-btn:hover { background: #e5e7eb; color: var(--text); }
    .msg-copy-btn.copied { background: #dcfce7; border-color: #86efac; color: #16a34a; }

    /* Streaming cursor */
    .msg.assistant.streaming::after {
      content: "▋";
      display: inline-block;
      animation: blink 0.7s step-end infinite;
      color: var(--brand);
      margin-left: 2px;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* ── Markdown content inside assistant messages ── */
    .msg-body p { margin: 0 0 8px; }
    .msg-body p:last-child { margin-bottom: 0; }
    .msg-body h3 { font-size: 14px; font-weight: 700; margin: 10px 0 4px; color: var(--text); }
    .msg-body h4 { font-size: 13px; font-weight: 700; margin: 8px 0 4px; color: var(--text); }
    .msg-body ul, .msg-body ol { padding-left: 18px; margin: 6px 0; }
    .msg-body li { margin: 3px 0; }
    .msg-body strong { font-weight: 700; }
    .msg-body em { font-style: italic; }
    .msg-body a { color: var(--brand); text-decoration: underline; }

    /* Inline code */
    .msg-body code {
      background: #f1f0ff; color: #4338ca;
      border-radius: 4px; padding: 1px 5px;
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 12px;
    }

    /* ── Code block ── */
    .code-block-wrapper {
      border: 1px solid #e0dff5;
      border-radius: 8px;
      overflow: hidden;
      margin: 8px 0;
      background: #1e1b2e;
    }
    .code-block-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 5px 12px;
      background: #2d2a3e;
      border-bottom: 1px solid #3d3a50;
    }
    .code-lang {
      font-size: 11px; font-weight: 600;
      color: #a78bfa; font-family: monospace;
      text-transform: lowercase;
    }
    .copy-code-btn {
      background: #3d3a50; border: 1px solid #4d4a60;
      color: #c4b5fd; border-radius: 4px;
      padding: 2px 9px; font-size: 11px; cursor: pointer;
      transition: background 0.15s;
    }
    .copy-code-btn:hover { background: #4d4a60; }
    .copy-code-btn.copied { background: #14532d; border-color: #166534; color: #86efac; }
    .code-block-wrapper pre {
      margin: 0; padding: 12px 14px;
      overflow-x: auto; background: #1e1b2e;
    }
    .code-block-wrapper pre code {
      background: none; color: #e2e8f0;
      padding: 0; border-radius: 0;
      font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
      font-size: 12px; line-height: 1.6;
      white-space: pre;
    }

    /* ── Thinking block ── */
    .thinking-block {
      align-self: flex-start;
      width: 90%;
      border: 1px solid var(--think-border);
      border-radius: 10px;
      overflow: hidden;
      background: var(--think-bg);
    }
    .thinking-header {
      display: flex; align-items: center; gap: 7px;
      padding: 8px 12px;
      cursor: pointer;
      user-select: none;
      font-size: 12px; font-weight: 600;
      color: var(--think-text);
      background: var(--think-bg);
    }
    .thinking-header:hover { background: #f3e8ff; }
    .thinking-spinner {
      width: 12px; height: 12px;
      border: 2px solid var(--think-border);
      border-top-color: var(--think-text);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .thinking-toggle { margin-left: auto; font-size: 10px; color: var(--think-text); }
    .thinking-body {
      padding: 0 12px 10px;
      font-size: 12px; color: #7c3aed;
      line-height: 1.55; white-space: pre-wrap;
      max-height: 200px; overflow-y: auto;
      border-top: 1px solid var(--think-border);
    }
    .thinking-body.collapsed { display: none; }

    /* ── Empty state ── */
    .empty-state {
      margin: auto; text-align: center;
      color: var(--muted); font-size: 13px; padding: 24px;
    }
    .empty-state .icon { font-size: 36px; margin-bottom: 10px; }

    /* ── Suggestions ── */
    #suggestions {
      padding: 0 12px 8px;
      display: flex; flex-wrap: wrap; gap: 5px;
      flex-shrink: 0;
    }
    .suggestion-chip {
      background: #ede9fe; color: var(--brand-dark);
      border: 1px solid #c4b5fd; border-radius: 99px;
      padding: 4px 11px; font-size: 11px; cursor: pointer;
    }
    .suggestion-chip:hover { background: #ddd6fe; }

    /* ── Input area ── */
    .input-area {
      display: flex; gap: 6px;
      padding: 10px 12px;
      border-top: 1px solid var(--border);
      background: #fff; flex-shrink: 0;
      align-items: flex-end;
    }
    #user-input {
      flex: 1; border: 1px solid var(--border);
      border-radius: 10px; padding: 9px 12px;
      font-size: 13px; resize: none; outline: none;
      font-family: inherit; min-height: 40px; max-height: 110px;
      overflow-y: auto;
    }
    #user-input:focus { border-color: var(--brand); }

    /* Think toggle button */
    #think-btn {
      background: none;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 0 8px;
      height: 40px;
      font-size: 15px;
      cursor: pointer;
      color: var(--muted);
      flex-shrink: 0;
      transition: all 0.15s;
      title: "Toggle extended thinking";
    }
    #think-btn:hover { border-color: #c4b5fd; color: var(--brand); }
    #think-btn.active {
      background: var(--think-bg);
      border-color: var(--think-border);
      color: var(--think-text);
    }
    #think-btn .think-label { font-size: 9px; display: block; text-align: center; line-height: 1; margin-top: 2px; }

    #send-btn {
      background: var(--brand); color: #fff; border: none;
      border-radius: 10px; width: 40px; height: 40px;
      font-size: 16px; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    #send-btn:hover { background: var(--brand-dark); }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Voice button ── */
    #voice-btn {
      background: none; border: 1.5px solid var(--border);
      border-radius: 8px; padding: 0 8px; height: 40px;
      font-size: 15px; cursor: pointer; color: var(--muted);
      flex-shrink: 0; transition: all 0.15s;
    }
    #voice-btn:hover { border-color: #c4b5fd; color: var(--brand); }
    #voice-btn.recording {
      border-color: #f87171; color: #dc2626;
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

    /* ── Screenshot button ── */
    #screenshot-btn {
      background: none; border: 1.5px solid var(--border);
      border-radius: 8px; padding: 0 8px; height: 40px;
      font-size: 15px; cursor: pointer; color: var(--muted);
      flex-shrink: 0; transition: all 0.15s;
    }
    #screenshot-btn:hover { border-color: #c4b5fd; color: var(--brand); }

    /* ── Screenshot preview in input area ── */
    #screenshot-preview-wrap {
      display: none; padding: 6px 12px 0;
      position: relative; width: fit-content;
    }
    #screenshot-preview-wrap img {
      max-height: 80px; border-radius: 6px;
      border: 1px solid var(--border);
    }
    #screenshot-remove-btn {
      position: absolute; top: 2px; right: -2px;
      background: #374151; color: #fff; border: none;
      border-radius: 50%; width: 18px; height: 18px;
      font-size: 11px; cursor: pointer; line-height: 18px;
      text-align: center; padding: 0;
    }

    /* ── Usage footer ── */
    #usage-bar {
      padding: 3px 12px;
      font-size: 10px; color: var(--muted);
      border-top: 1px solid var(--border);
      background: #fff; text-align: right;
      flex-shrink: 0; display: none;
    }
    body.dark #usage-bar { background: #0f0e1a; border-color: #2d2a3e; }

    /* ── Pin button in context banner ── */
    #pin-btn {
      background: transparent; border: 1px solid #a78bfa;
      color: #7c3aed; border-radius: 6px;
      padding: 3px 8px; font-size: 11px;
      font-weight: 600; cursor: pointer; flex-shrink: 0;
    }
    #pin-btn:hover { background: #ede9fe; }
    #pin-btn.pinned { background: #6366f1; color: #fff; border-color: #6366f1; }

    /* ── History view ── */
    #history-view { display: none; flex-direction: column; flex: 1; overflow: hidden; }
    #history-view.active { display: flex; }

    .history-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 14px; border-bottom: 1px solid var(--border);
      background: #fff; flex-shrink: 0; gap: 8px; flex-wrap: wrap;
    }
    .history-toolbar span { font-size: 12px; color: var(--muted); }
    #history-search {
      flex: 1; min-width: 0; border: 1px solid var(--border);
      border-radius: 7px; padding: 5px 10px;
      font-size: 12px; outline: none; font-family: inherit;
      background: var(--surface); color: var(--text);
    }
    #history-search:focus { border-color: var(--brand); }
    .clear-all-btn {
      background: none; border: 1px solid #fca5a5;
      color: #dc2626; border-radius: 6px;
      padding: 3px 10px; font-size: 11px; cursor: pointer; flex-shrink: 0;
    }
    .clear-all-btn:hover { background: #fee2e2; }

    #history-list {
      flex: 1; overflow-y: auto; padding: 10px;
      display: flex; flex-direction: column; gap: 7px;
    }
    .history-item {
      background: #fff; border: 1px solid var(--border);
      border-radius: 10px; padding: 11px 13px;
      cursor: pointer; display: flex; gap: 10px; align-items: flex-start;
    }
    .history-item:hover { border-color: var(--brand); box-shadow: 0 2px 8px rgba(99,102,241,0.12); }
    .history-item-body { flex: 1; min-width: 0; }
    .history-item-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-item-meta { font-size: 11px; color: var(--muted); margin-top: 3px; display: flex; gap: 8px; }
    .history-item-preview { font-size: 12px; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-delete-btn { background: none; border: none; color: #d1d5db; font-size: 15px; cursor: pointer; flex-shrink: 0; }
    .history-delete-btn:hover { color: #dc2626; }
    .history-empty { margin: auto; text-align: center; color: var(--muted); font-size: 13px; padding: 32px; }
    .history-empty .icon { font-size: 32px; margin-bottom: 10px; }

    /* ── Font size control ── */
    #messages.font-sm .msg { font-size: 11px; }
    #messages.font-md .msg { font-size: 13px; }
    #messages.font-lg .msg { font-size: 15px; }
    .font-btn {
      background: rgba(255,255,255,0.2); border: none; color: #fff;
      border-radius: 5px; padding: 3px 7px; font-size: 12px;
      cursor: pointer; font-weight: 700; line-height: 1;
    }
    .font-btn:hover { background: rgba(255,255,255,0.35); }
    .font-btn.active { background: rgba(255,255,255,0.45); }

    /* ── Dark mode ── */
    body.dark {
      --surface: #0f0e1a;
      --border: #2d2a3e;
      --text: #e2e8f0;
      --muted: #9ca3af;
      --think-bg: #1e1b2e;
      --think-border: #3d3a50;
      --think-text: #c4b5fd;
      color-scheme: dark;
    }
    body.dark .tabs           { background: #15131f; }
    body.dark .tab            { color: #6b7280; }
    body.dark .tab.active     { color: #818cf8; border-bottom-color: #818cf8; }
    body.dark #context-banner { background: #1a1730; border-color: #2d2a3e; color: #a78bfa; }
    body.dark .msg.assistant  { background: #1e1b2e; color: #e2e8f0; }
    body.dark .msg-copy-btn   { background: #2d2a3e; border-color: #3d3a50; color: #9ca3af; }
    body.dark .input-area     { background: #0f0e1a; border-color: #2d2a3e; }
    body.dark #user-input     { background: #1e1b2e; border-color: #2d2a3e; color: #e2e8f0; }
    body.dark #user-input::placeholder { color: #4b5563; }
    body.dark .suggestion-chip { background: #1e1b2e; border-color: #3d3a50; color: #a78bfa; }
    body.dark .suggestion-chip:hover { background: #2d2a3e; }
    body.dark .history-toolbar { background: #0f0e1a; border-color: #2d2a3e; }
    body.dark .history-item   { background: #1e1b2e; border-color: #2d2a3e; color: #e2e8f0; }
    body.dark .history-item:hover { border-color: #6366f1; }
    body.dark .history-item-meta, body.dark .history-item-preview { color: #6b7280; }
    body.dark #history-search { background: #1e1b2e; border-color: #2d2a3e; color: #e2e8f0; }
    body.dark #think-btn      { border-color: #3d3a50; color: #9ca3af; }

    /* ── Template button ── */
    #template-btn {
      background: none; border: 1.5px solid var(--border);
      border-radius: 8px; padding: 0 8px; height: 40px;
      font-size: 15px; cursor: pointer; color: var(--muted);
      flex-shrink: 0; transition: all 0.15s;
    }
    #template-btn:hover { border-color: #c4b5fd; color: var(--brand); }
    #template-btn.open  { border-color: var(--brand); color: var(--brand); background: #ede9fe; }
    body.dark #template-btn { border-color: #3d3a50; color: #9ca3af; }
    body.dark #template-btn.open { background: #1e1b2e; border-color: #6366f1; color: #a78bfa; }

    /* ── Template dropdown ── */
    #template-dropdown {
      display: none;
      flex-direction: column;
      position: absolute; bottom: 100%; left: 0; right: 0;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px 12px 0 0;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
      z-index: 100;
      max-height: 320px;
      overflow: hidden;
    }
    #template-dropdown.open { display: flex; }
    body.dark #template-dropdown { background: #1e1b2e; border-color: #2d2a3e; }

    .tpl-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px 8px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .tpl-header-title { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    body.dark .tpl-header { border-color: #2d2a3e; }

    .tpl-add-btn {
      background: var(--brand); color: #fff; border: none;
      border-radius: 6px; padding: 3px 10px;
      font-size: 11px; font-weight: 600; cursor: pointer;
    }
    .tpl-add-btn:hover { background: var(--brand-dark); }

    #tpl-list {
      overflow-y: auto; flex: 1;
      padding: 6px 8px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .tpl-item {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 10px; border-radius: 8px;
      cursor: pointer; border: 1px solid transparent;
      transition: background 0.12s, border-color 0.12s;
    }
    .tpl-item:hover { background: #f5f3ff; border-color: #ddd6fe; }
    body.dark .tpl-item:hover { background: #2d2a3e; border-color: #3d3a50; }
    .tpl-item-name { flex: 1; font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tpl-item-preview { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; max-width: 120px; }
    .tpl-delete-btn { background: none; border: none; color: #d1d5db; font-size: 14px; cursor: pointer; flex-shrink: 0; padding: 0 2px; line-height: 1; }
    .tpl-delete-btn:hover { color: #dc2626; }

    .tpl-empty { padding: 18px 14px; text-align: center; font-size: 12px; color: var(--muted); }

    /* Add template form */
    #tpl-add-form {
      display: none; flex-direction: column; gap: 7px;
      padding: 10px 12px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    #tpl-add-form.open { display: flex; }
    body.dark #tpl-add-form { border-color: #2d2a3e; }
    .tpl-form-row { display: flex; gap: 6px; }
    #tpl-name-input, #tpl-prompt-input {
      border: 1px solid var(--border); border-radius: 7px;
      padding: 6px 10px; font-size: 12px; outline: none;
      font-family: inherit; background: var(--surface); color: var(--text);
      width: 100%;
    }
    #tpl-name-input:focus, #tpl-prompt-input:focus { border-color: var(--brand); }
    body.dark #tpl-name-input, body.dark #tpl-prompt-input { background: #15131f; border-color: #2d2a3e; color: #e2e8f0; }
    #tpl-prompt-input { resize: none; min-height: 56px; }
    .tpl-form-actions { display: flex; gap: 6px; justify-content: flex-end; }
    .tpl-save-btn {
      background: var(--brand); color: #fff; border: none;
      border-radius: 6px; padding: 5px 14px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .tpl-save-btn:hover { background: var(--brand-dark); }
    .tpl-cancel-btn {
      background: none; border: 1px solid var(--border); color: var(--muted);
      border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer;
    }
    .tpl-cancel-btn:hover { background: var(--surface); }

    /* Settings button highlights red when no key */
    #settings-btn.needs-key {
      background: #DC2626 !important;
      color: #fff !important;
      font-weight: 700;
    }

  </style>
</head>
<body>

<div class="header">
  <span class="header-logo">✨</span>
  <span class="header-title">Rashmi AI</span>
  <button class="font-btn" id="font-sm-btn" title="Small text">A-</button>
  <button class="font-btn active" id="font-md-btn" title="Medium text">A</button>
  <button class="font-btn" id="font-lg-btn" title="Large text">A+</button>
  <button class="header-btn" id="export-btn" title="Export chat">📤</button>
  <button class="header-btn" id="dark-btn" title="Toggle dark mode">🌙</button>
  <button class="header-btn" id="settings-btn" title="Settings / API key">⚙️</button>
  <button class="header-btn" id="new-chat-btn">+ New</button>
  <button class="header-btn" id="clear-btn">Clear</button>
</div>

<div class="tabs">
  <button class="tab active" id="tab-chat">💬 Chat</button>
  <button class="tab" id="tab-history">🕓 History</button>
</div>


<div id="context-banner">
  <span id="context-text">No page scanned yet</span>
  <button id="pin-btn" title="Pin this page to context">📌</button>
  <button id="scan-btn">⟳ Scan</button>
</div>

<!-- ── CHAT VIEW ── -->
<div id="chat-view">
  <div id="messages">
    <div class="empty-state">
      <div class="icon">🎓</div>
      <strong>Hi, I'm Rashmi 👋</strong>
      <p style="margin-top:6px">Navigate to any webpage, click<br>⟳ Scan, then ask me anything.</p>
    </div>
  </div>

  <div id="suggestions">
    <span class="suggestion-chip" data-prompt="Summarise the key points of this page.">Summarise page</span>
    <span class="suggestion-chip" data-prompt="What are the most important concepts I should understand?">Key concepts</span>
    <span class="suggestion-chip" data-prompt="Create 3 practice questions based on this material.">Practice Qs</span>
    <span class="suggestion-chip" data-prompt="Explain this topic as if I'm a beginner.">ELI5</span>
  </div>

  <div id="screenshot-preview-wrap">
    <img id="screenshot-preview" src="" alt="screenshot" />
    <button id="screenshot-remove-btn" title="Remove">✕</button>
  </div>

  <!-- Template dropdown (anchored above input) -->
  <div style="position:relative">
    <div id="template-dropdown">
      <div class="tpl-header">
        <span class="tpl-header-title">📋 Templates</span>
        <button class="tpl-add-btn" id="tpl-new-btn">＋ New</button>
      </div>
      <div id="tpl-list"></div>
      <div id="tpl-add-form">
        <input id="tpl-name-input" type="text" placeholder="Template name…" maxlength="40" />
        <textarea id="tpl-prompt-input" placeholder="Prompt text…" rows="3"></textarea>
        <div class="tpl-form-actions">
          <button class="tpl-cancel-btn" id="tpl-cancel-btn">Cancel</button>
          <button class="tpl-save-btn"   id="tpl-save-btn">Save template</button>
        </div>
      </div>
    </div>
  </div>

  <div class="input-area">
    <textarea id="user-input" placeholder="Ask about this page…" rows="1"></textarea>
    <button id="template-btn" title="Prompt templates">📋</button>
    <button id="voice-btn" title="Voice input">🎤</button>
    <button id="screenshot-btn" title="Capture screenshot">📸</button>
    <button id="think-btn" title="Toggle extended thinking (Sonnet/Opus only)">
      🧠<span class="think-label">Think</span>
    </button>
    <button id="send-btn" title="Send">➤</button>
  </div>
  <div id="usage-bar"></div>
</div>

<!-- ── HISTORY VIEW ── -->
<div id="history-view">
  <div class="history-toolbar">
    <input type="text" id="history-search" placeholder="🔍 Search conversations…" />
    <span id="history-count">0</span>
    <button class="clear-all-btn" id="clear-all-btn">Delete all</button>
  </div>
  <div id="history-list">
    <div class="history-empty">
      <div class="icon">🕓</div>
      <p>No chat history yet.<br>Start a conversation!</p>
    </div>
  </div>
</div>


<script src="sidepanel.js"></script>
</body>
</html>
